# Luxury Finishing production site
# Install as /etc/nginx/sites-available/luxury-finishing.conf and enable it.

upstream luxury_finishing_app {
  server 127.0.0.1:3007;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name luxury-finishing.alazab.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name luxury-finishing.alazab.com;

  ssl_certificate /etc/letsencrypt/live/luxury-finishing.alazab.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/luxury-finishing.alazab.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:LuxuryFinishingTLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  server_tokens off;
  client_max_body_size 16m;

  access_log /var/log/nginx/luxury-finishing.access.log;
  error_log /var/log/nginx/luxury-finishing.error.log warn;

  # Remove any conflicting headers returned by an upstream and enforce one policy.
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Cross-Origin-Opener-Policy;
  proxy_hide_header Cross-Origin-Resource-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://al-azab.co; media-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.elevenlabs.io https://*.elevenlabs.io wss://*.elevenlabs.io; frame-src 'self' https://*.elevenlabs.io; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  # Never SPA-fallback sensitive or development-only paths.
  location ~ /\.(?!well-known(?:/|$)) {
    return 404;
  }

  location ~* \.map$ {
    return 404;
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
  }

  # Public API routes forwarded to Supabase Edge Functions.
  location = /api/v1/auth/hooks {
    proxy_pass https://lnoyiwrulvoaaerpiqxc.supabase.co/functions/v1/auth-hooks;
    proxy_ssl_server_name on;
    proxy_ssl_name lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header Host lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location = /api/v2/whatsapp/hooks {
    proxy_pass https://lnoyiwrulvoaaerpiqxc.supabase.co/functions/v1/whatsapp-hooks;
    proxy_ssl_server_name on;
    proxy_ssl_name lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header Host lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location = /api/maintenance/gateway {
    proxy_pass https://lnoyiwrulvoaaerpiqxc.supabase.co/functions/v1/maintenance-gateway-api;
    proxy_ssl_server_name on;
    proxy_ssl_name lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header Host lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location = /api/v1/meta/webhook {
    proxy_pass https://lnoyiwrulvoaaerpiqxc.supabase.co/functions/v1/meta-webhook;
    proxy_ssl_server_name on;
    proxy_ssl_name lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header Host lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location = /api/v1/meta/data-deletion {
    proxy_pass https://lnoyiwrulvoaaerpiqxc.supabase.co/functions/v1/meta-data-deletion;
    proxy_ssl_server_name on;
    proxy_ssl_name lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header Host lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location = /api/v1/notifications/system {
    proxy_pass https://lnoyiwrulvoaaerpiqxc.supabase.co/functions/v1/system-notifications;
    proxy_ssl_server_name on;
    proxy_ssl_name lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header Host lnoyiwrulvoaaerpiqxc.supabase.co;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # The PM2 application owns SPA fallback, health checks, method policy and caching.
  location / {
    proxy_pass http://luxury_finishing_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }
}
